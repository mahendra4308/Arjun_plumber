<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Arjun Plumbing Mart</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    :root{
  --primary:#8b1238;
  --primary-dark:#5f0c27;
  --primary-light:#fdf4f7;
}

.contact-page{
  min-height:100vh;
  background:#f8f9fb;
  padding:20px;
}

.contact-header{
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:25px;
}

.back-btn{
  width:42px;
  height:42px;
  border:none;
  border-radius:12px;
  background:var(--primary);
  color:#fff;
  cursor:pointer;
}

.contact-header h2{
  color:var(--primary);
  font-size:24px;
}

.contact-card{
  background:#fff;
  border-radius:24px;
  padding:30px 22px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
  text-align:center;
}

.contact-logo{
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid var(--primary-light);
}

.contact-card h1{
  margin:15px 0 8px;
  color:var(--primary);
  font-size:28px;
}

.contact-tagline{
  color:#666;
  margin-bottom:25px;
}

.contact-info{
  display:flex;
  flex-direction:column;
  gap:16px;
}

.info-box{
  display:flex;
  align-items:center;
  gap:15px;
  padding:16px;
  border:1px solid #eee;
  border-radius:16px;
  text-align:left;
}

.info-box i{
  width:46px;
  height:46px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--primary-light);
  color:var(--primary);
  font-size:20px;
}

.info-box span{
  display:block;
  font-size:13px;
  color:#777;
  margin-bottom:4px;
}

.info-box a,
.info-box p{
  margin:0;
  color:#222;
  text-decoration:none;
  font-weight:600;
}

.contact-actions{
  display:flex;
  gap:14px;
  margin-top:28px;
}

.action-btn{
  flex:1;
  text-decoration:none;
  color:#fff;
  padding:15px;
  border-radius:16px;
  font-weight:600;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.action-btn.call{
  background:var(--primary);
}

.action-btn.whatsapp{
  background:#25D366;
}
  </style>
</head>
<body>

<div class="contact-page">

  <div class="contact-header">
    <button class="back-btn" onclick="history.back()">
      <i class="fas fa-arrow-left"></i>
    </button>
    <h2>Contact Us</h2>
  </div>

  <div class="contact-card">

    <img src="logo.png" alt="Logo" class="contact-logo" data-logo>

    <h1 data-shop-name>Arjun Plumbing Mart</h1>
    <p class="contact-tagline" data-tagline>हर फिटिंग सही रेट पर, सीधा ऑर्डर</p>

    <div class="contact-info">

      <div class="info-box">
        <i class="fas fa-phone"></i>
        <div>
          <span>Mobile Number</span>
          <a href="tel:9005009036" data-call-link data-mobile>9005009036</a>
        </div>
      </div>

      <div class="info-box">
        <i class="fab fa-whatsapp"></i>
        <div>
          <span>WhatsApp</span>
          <a href="https://wa.me/919005009036" data-whatsapp>Chat on WhatsApp</a>
        </div>
      </div>

      <div class="info-box">
        <i class="fas fa-location-dot"></i>
        <div>
          <span>Address</span>
          <p data-address>Kamlapur, Sitapur, Uttar Pradesh</p>
        </div>
      </div>

      <div class="info-box">
        <i class="fas fa-clock"></i>
        <div>
          <span>Shop Timing</span>
          <p>9:00 AM - 8:00 PM</p>
        </div>
      </div>

    </div>

    <div class="contact-actions">
      <a href="tel:9005009036" class="action-btn call" data-call-link>
        <i class="fas fa-phone"></i> Call Now
      </a>

      <a href="https://wa.me/919005009036" class="action-btn whatsapp" data-whatsapp>
        <i class="fab fa-whatsapp"></i> WhatsApp
      </a>
    </div>

  </div>

</div>

<script src="SiteSettings.js"></script>
</body>
</html>
